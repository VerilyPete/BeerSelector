name: Native and Contract Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native iOS Tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Cloud configuration boundary
        run: python3 native-ios/Scripts/test-cloud-configuration.py
      - name: Prepare test-only configuration
        run: sh native-ios/ci_scripts/ci_post_clone.sh
      - name: Run native All test plan
        env:
          BEERSELECTOR_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro
          BEERSELECTOR_TEST_BUILD_DIR: ${{ runner.temp }}/BeerSelectorNative-tests
        run: sh native-ios/Scripts/run-tests.sh -resultBundlePath "${{ runner.temp }}/NativeTests.xcresult"
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-results
          path: ${{ runner.temp }}/NativeTests.xcresult
          if-no-files-found: warn

  contracts:
    name: Enrichment Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
