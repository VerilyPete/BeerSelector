# Maestro E2E Test Workflow
#
# This workflow runs Maestro E2E tests in multiple modes:
# 1. maestro-ios: Full sequential test suite (on main/develop push)
# 2. maestro-ios-parallel: Parallel test execution (on PRs for speed)
# 3. maestro-ios-critical: Fast P0 tests only (on all events)
# 4. maestro-android: Android test suite
#
# Parallel execution reduces PR feedback time from 45min to ~15min by running
# test groups concurrently. Each group runs independently on a separate runner.

name: Maestro E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual trigger

env:
  # Default environment configuration for CI
  EXPO_PUBLIC_USE_MOCK_SERVER: 'true'
  EXPO_PUBLIC_API_TIMEOUT: '30000'
  NODE_VERSION: '20'
  MAESTRO_VERSION: '2.4.0'

jobs:
  maestro-ios:
    name: Maestro E2E Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Maestro CLI
        run: |
          # Install Maestro with verbose output
          # Pinned. Why, and the caveat that this does NOT by itself make a
          # local run predict CI (nothing pins your machine): see "How Maestro
          # validates this suite", point 4, in .maestro/README.md.
          export MAESTRO_VERSION=2.4.0
          curl -fsSL https://get.maestro.mobile.dev | bash

          # Verify installation directory exists
          if [ ! -d "$HOME/.maestro/bin" ]; then
            echo "Error: Maestro installation directory not found"
            exit 1
          fi

          # Verify maestro binary exists
          if [ ! -f "$HOME/.maestro/bin/maestro" ]; then
            echo "Error: Maestro binary not found"
            ls -la "$HOME/.maestro/bin" || true
            exit 1
          fi

          # Make sure it's executable
          chmod +x "$HOME/.maestro/bin/maestro"

          # Add to PATH for this step
          export PATH="$HOME/.maestro/bin:$PATH"

          # Add to PATH for future steps
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

          # Assert the pin actually took. The checks above catch an installer
          # that failed outright; they say nothing about which VERSION landed.
          # `MAESTRO_VERSION` is read by the installer script, not enforced by
          # it — a corrupt or partial download, an installer that silently
          # ignores an unset/misread env var, or an upstream change to how the
          # version is selected could all still produce a working `maestro`
          # binary that passes the checks above while being the wrong
          # version. The pin's entire purpose — a fixed, reproducible CLI —
          # depends on this being asserted, not merely printed.
          #
          # CANONICAL: the other four copies of this step point here rather
          # than restating the argument.
          ACTUAL_VERSION=$(maestro --version)
          if [ "$ACTUAL_VERSION" != "$MAESTRO_VERSION" ]; then
            echo "Error: installed Maestro is '$ACTUAL_VERSION', expected '$MAESTRO_VERSION'"
            exit 1
          fi
          echo "Maestro $ACTUAL_VERSION installed (pinned)"

      - name: Setup iOS Simulator
        run: |
          # List available simulators
          xcrun simctl list devices available

          # Pick whatever iPhone the runner image actually provides, rather
          # than naming one. These steps hardcoded specific models (16 Pro, 14
          # Pro, and a 15-then-14 fallback), commented "available on GitHub
          # Actions runners" — true when written, false by Xcode 26.5.
          # Selecting from what is present cannot go stale.
          #
          # `|| true` on `boot` only, not on `bootstatus`. An already-booted
          # device makes `simctl boot` exit non-zero for a benign reason —
          # common on a fresh runner — and that alone used to be swallowed
          # right along with a real failure, surfacing two steps later as an
          # opaque `simctl install`/xcodebuild destination error instead of
          # here. `bootstatus` is the actual gate: it blocks until the
          # device reaches Booted, and is what must fail loudly if it never
          # does.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.isAvailable)] | map(select(.name | test("^iPhone"))) | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available on this runner image:"
            xcrun simctl list devices
            exit 1
          fi
          echo "Booting $(xcrun simctl list devices -j | jq -r --arg u "$UDID" '[.devices[][]|select(.udid==$u)]|first|.name') ($UDID)"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Setup test environment
        run: |
          # Create test environment file
          cp .env.example .env.test
          echo "EXPO_PUBLIC_USE_MOCK_SERVER=true" >> .env.test
          echo "EXPO_PUBLIC_API_BASE_URL=http://localhost:3000" >> .env.test
          echo "EXPO_PUBLIC_API_TIMEOUT=30000" >> .env.test

      - name: Prebuild Expo app for iOS
        run: npx expo prebuild --platform ios --clean

      - name: Cache iOS build
        uses: actions/cache@v3
        with:
          path: ios/build
          key: ${{ runner.os }}-ios-build-${{ hashFiles('ios/**/*.{h,m,swift}') }}
          restore-keys: |
            ${{ runner.os }}-ios-build-

      - name: Build iOS app for testing
        run: |
          cd ios
          xcodebuild \
            -workspace BeerSelector.xcworkspace \
            -scheme BeerSelector \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Install app on simulator
        run: |
          # Find the app bundle
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          echo "App path: $APP_PATH"

          # $SIMULATOR_UDID: exported to $GITHUB_ENV by "Setup iOS Simulator"
          # above, and available here as a normal env var for that reason.
          # Re-deriving it here via `grep -m 1 iPhone` — the previous version
          # of this step — silently reintroduces the exact ambiguity that
          # step exists to remove: on a runner with more than one iPhone
          # simulator (available, not necessarily booted), `grep -m 1` picks
          # whichever `simctl` happens to list first, which is not
          # guaranteed to be the one just booted and about to run the tests.
          echo "Simulator UDID: $SIMULATOR_UDID"

          # Install on simulator
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Start mock server (if needed)
        if: env.EXPO_PUBLIC_USE_MOCK_SERVER == 'true'
        run: |
          # Start mock API server in background
          npm run mock-server &
          echo $! > mock-server.pid
          sleep 5  # Wait for server to start

      - name: Run Maestro E2E Tests
        run: |
          maestro test .maestro/ \
            --format junit \
            --output maestro-results.xml

      - name: Stop mock server
        if: always() && env.EXPO_PUBLIC_USE_MOCK_SERVER == 'true'
        run: |
          if [ -f mock-server.pid ]; then
            kill $(cat mock-server.pid) || true
            rm mock-server.pid
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results-ios
          path: |
            maestro-results.xml
            ~/.maestro/tests/

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-ios
          path: ~/.maestro/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maestro E2E Tests (iOS)
          path: maestro-results.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  maestro-ios-critical:
    name: Maestro Critical Tests (iOS) - Fast
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Maestro CLI
        run: |
          # Pinned. Why, and the caveat that this does NOT by itself make a
          # local run predict CI (nothing pins your machine): see "How Maestro
          # validates this suite", point 4, in .maestro/README.md.
          #
          # This step used to be three lines: install, add to PATH, done — no
          # `-d`/`-f` guard on the install succeeding, no pin assertion. Every
          # other job's "Install Maestro CLI" step already has both; this one
          # had neither, so a corrupt/partial download or a silently-ignored
          # `MAESTRO_VERSION` would surface here as an unrelated Maestro
          # failure two steps later instead of a clear installer error.
          export MAESTRO_VERSION=2.4.0
          curl -fsSL https://get.maestro.mobile.dev | bash

          # Verify installation directory exists
          if [ ! -d "$HOME/.maestro/bin" ]; then
            echo "Error: Maestro installation directory not found"
            exit 1
          fi

          # Verify maestro binary exists
          if [ ! -f "$HOME/.maestro/bin/maestro" ]; then
            echo "Error: Maestro binary not found"
            ls -la "$HOME/.maestro/bin" || true
            exit 1
          fi

          # Make sure it's executable
          chmod +x "$HOME/.maestro/bin/maestro"

          # Add to PATH for this step
          export PATH="$HOME/.maestro/bin:$PATH"

          # Add to PATH for future steps
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

          # Assert the pin actually took — see the comment on this pattern in
          # the "maestro-ios" job's "Install Maestro CLI" step.
          ACTUAL_VERSION=$(maestro --version)
          if [ "$ACTUAL_VERSION" != "$MAESTRO_VERSION" ]; then
            echo "Error: installed Maestro is '$ACTUAL_VERSION', expected '$MAESTRO_VERSION'"
            exit 1
          fi
          echo "Maestro $ACTUAL_VERSION installed (pinned)"

      - name: Setup iOS Simulator
        run: |
          # Pick whatever iPhone the runner image actually provides, rather
          # than naming one. These steps hardcoded specific models (16 Pro, 14
          # Pro, and a 15-then-14 fallback), commented "available on GitHub
          # Actions runners" — true when written, false by Xcode 26.5.
          # Selecting from what is present cannot go stale.
          #
          # `|| true` on `boot` only, not on `bootstatus`. An already-booted
          # device makes `simctl boot` exit non-zero for a benign reason —
          # common on a fresh runner — and that alone used to be swallowed
          # right along with a real failure, surfacing two steps later as an
          # opaque `simctl install`/xcodebuild destination error instead of
          # here. `bootstatus` is the actual gate: it blocks until the
          # device reaches Booted, and is what must fail loudly if it never
          # does.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.isAvailable)] | map(select(.name | test("^iPhone"))) | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available on this runner image:"
            xcrun simctl list devices
            exit 1
          fi
          echo "Booting $(xcrun simctl list devices -j | jq -r --arg u "$UDID" '[.devices[][]|select(.udid==$u)]|first|.name') ($UDID)"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Prebuild and Build iOS app
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          xcodebuild -workspace BeerSelector.xcworkspace -scheme BeerSelector -configuration Debug -sdk iphonesimulator -derivedDataPath build build

      - name: Install app on simulator
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          # $SIMULATOR_UDID, not `booted` — exported to $GITHUB_ENV by
          # "Setup iOS Simulator" above. Bare `booted` silently picks
          # whichever simulator simctl considers "the" booted one, which is
          # exactly the ambiguity that step's UDID selection exists to
          # remove, and reopens it if more than one simulator is running.
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Run Critical P0 Tests Only
        run: |
          maestro test .maestro/01-beer-list-rendering.yaml
          maestro test .maestro/06-login-flow-member.yaml
          maestro test .maestro/07-login-flow-visitor.yaml
          maestro test .maestro/09-refresh-functionality.yaml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-critical-results-ios
          path: ~/.maestro/tests/

  maestro-ios-parallel:
    name: Maestro iOS Tests (Parallel - ${{ matrix.test-group.name }})
    runs-on: macos-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'  # Only on PRs for speed

    strategy:
      fail-fast: false  # Continue running other test groups even if one fails
      matrix:
        test-group:
          - name: login-flows
            description: Login and authentication flows
            tests: >-
              .maestro/06-login-flow-member.yaml
              .maestro/07-login-flow-visitor.yaml
              .maestro/LOGIN_WEBVIEW_ERROR_HANDLING.yaml

          - name: settings
            description: Settings and configuration
            tests: >-
              .maestro/10-settings-configuration.yaml
              .maestro/11-settings-first-launch.yaml
              .maestro/SETTINGS_AUTO_LOGIN.yaml

          - name: beer-features
            description: Beer list features and navigation
            tests: >-
              .maestro/01-beer-list-rendering.yaml
              .maestro/02-search-and-filter.yaml
              .maestro/03-beer-item-expansion.yaml
              .maestro/05-navigation-and-tabs.yaml
              .maestro/09-refresh-functionality.yaml

          - name: offline-network
            description: Offline support and network handling
            tests: >-
              .maestro/12-offline-scenarios.yaml
              .maestro/13-network-timeout-recovery.yaml
              .maestro/16-offline-mode.yaml
              .maestro/MP-7-STEP-2-OPERATION-QUEUE-TESTS.yaml

          - name: error-handling
            description: Error handling and edge cases
            tests: >-
              .maestro/04-empty-states.yaml
              .maestro/14-api-error-handling.yaml
              .maestro/15-config-validation.yaml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Maestro CLI
        run: |
          # Install Maestro with verbose output
          # Pinned. Why, and the caveat that this does NOT by itself make a
          # local run predict CI (nothing pins your machine): see "How Maestro
          # validates this suite", point 4, in .maestro/README.md.
          export MAESTRO_VERSION=2.4.0
          curl -fsSL https://get.maestro.mobile.dev | bash

          # Verify installation directory exists
          if [ ! -d "$HOME/.maestro/bin" ]; then
            echo "Error: Maestro installation directory not found"
            exit 1
          fi

          # Verify maestro binary exists
          if [ ! -f "$HOME/.maestro/bin/maestro" ]; then
            echo "Error: Maestro binary not found"
            ls -la "$HOME/.maestro/bin" || true
            exit 1
          fi

          # Make sure it's executable
          chmod +x "$HOME/.maestro/bin/maestro"

          # Add to PATH for this step
          export PATH="$HOME/.maestro/bin:$PATH"

          # Add to PATH for future steps
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

          # Assert the pin actually took — the checks above prove only that
          # SOME maestro installed, not which version. Full argument at the
          # canonical copy of this step in .github/workflows/maestro-e2e.yml.
          ACTUAL_VERSION=$(maestro --version)
          if [ "$ACTUAL_VERSION" != "$MAESTRO_VERSION" ]; then
            echo "Error: installed Maestro is '$ACTUAL_VERSION', expected '$MAESTRO_VERSION'"
            exit 1
          fi
          echo "Maestro $ACTUAL_VERSION installed (pinned)"

      - name: Setup iOS Simulator
        run: |
          # Pick whatever iPhone the runner image actually provides, rather
          # than naming one. These steps hardcoded specific models (16 Pro, 14
          # Pro, and a 15-then-14 fallback), commented "available on GitHub
          # Actions runners" — true when written, false by Xcode 26.5.
          # Selecting from what is present cannot go stale.
          #
          # `|| true` on `boot` only, not on `bootstatus`. An already-booted
          # device makes `simctl boot` exit non-zero for a benign reason —
          # common on a fresh runner — and that alone used to be swallowed
          # right along with a real failure, surfacing two steps later as an
          # opaque `simctl install`/xcodebuild destination error instead of
          # here. `bootstatus` is the actual gate: it blocks until the
          # device reaches Booted, and is what must fail loudly if it never
          # does.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.isAvailable)] | map(select(.name | test("^iPhone"))) | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available on this runner image:"
            xcrun simctl list devices
            exit 1
          fi
          echo "Booting $(xcrun simctl list devices -j | jq -r --arg u "$UDID" '[.devices[][]|select(.udid==$u)]|first|.name') ($UDID)"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Setup test environment
        run: |
          cp .env.example .env.test
          echo "EXPO_PUBLIC_USE_MOCK_SERVER=true" >> .env.test
          echo "EXPO_PUBLIC_API_BASE_URL=http://localhost:3000" >> .env.test
          echo "EXPO_PUBLIC_API_TIMEOUT=30000" >> .env.test

      - name: Prebuild Expo app for iOS
        run: npx expo prebuild --platform ios --clean

      - name: Cache iOS build
        uses: actions/cache@v3
        with:
          path: ios/build
          key: ${{ runner.os }}-ios-build-${{ hashFiles('ios/**/*.{h,m,swift}') }}
          restore-keys: |
            ${{ runner.os }}-ios-build-

      - name: Build iOS app for testing
        run: |
          cd ios
          xcodebuild \
            -workspace BeerSelector.xcworkspace \
            -scheme BeerSelector \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Install app on simulator
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          echo "App path: $APP_PATH"
          # $SIMULATOR_UDID: exported to $GITHUB_ENV by "Setup iOS Simulator"
          # above — see the comment on this pattern in the "maestro-ios" job's
          # "Install app on simulator" step. Re-deriving it here via
          # `grep -m 1 iPhone` reopens the same ambiguity.
          echo "Simulator UDID: $SIMULATOR_UDID"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Start mock server (if needed)
        if: env.EXPO_PUBLIC_USE_MOCK_SERVER == 'true'
        run: |
          npm run mock-server &
          echo $! > mock-server.pid
          sleep 5

      - name: Run ${{ matrix.test-group.name }} tests
        run: |
          echo "Running ${{ matrix.test-group.description }}"

          # `|| true` per test, not on the loop: every test in the group must
          # still run even after an earlier one fails — that's the point of
          # grouping them — but the step as a whole must not silently swallow
          # every failure it sees. `group_failed` is what closes that gap: it
          # is what `test-summary` (via `needs.maestro-ios-parallel.result`)
          # now actually depends on to report this job's true outcome, instead
          # of a directory-existence check that was true whether or not any
          # test here passed.
          group_failed=0
          for test in ${{ matrix.test-group.tests }}; do
            echo "Running test: $test"
            maestro test "$test" \
              --format junit \
              --output "maestro-results-${{ matrix.test-group.name }}-$(basename $test .yaml).xml" || group_failed=1
          done
          exit $group_failed

      - name: Stop mock server
        if: always() && env.EXPO_PUBLIC_USE_MOCK_SERVER == 'true'
        run: |
          if [ -f mock-server.pid ]; then
            kill $(cat mock-server.pid) || true
            rm mock-server.pid
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-parallel-results-${{ matrix.test-group.name }}
          path: |
            maestro-results-*.xml
            ~/.maestro/tests/

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-parallel-screenshots-${{ matrix.test-group.name }}
          path: ~/.maestro/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maestro E2E Tests (iOS - ${{ matrix.test-group.name }})
          path: maestro-results-*.xml
          reporter: java-junit
          # Not this step's job to fail the build — the "Run tests" step above
          # already does that for real (`exit $group_failed`), and
          # `test-summary` reads that outcome via `needs.*.result`. This
          # annotation is presentation only: per-test pass/fail detail on the
          # PR, not the signal anything downstream depends on.
          fail-on-error: false
          fail-on-empty: false

  maestro-android:
    name: Maestro E2E Tests (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Known-red, non-blocking. Every flow's `appId:` hardcodes
    # org.verily.FSbeerselector — the iOS bundle — by design; Android is not
    # a supported target right now. This job WILL fail at launchApp, every
    # time, and that is expected rather than a regression to chase.
    # `continue-on-error` keeps it from blocking merges while `test-summary`
    # still reports its real (red) result rather than hiding it — see the
    # comment there. Kept, not deleted, so re-enabling Android later is a
    # config change (parameterise appId again, drop this line) rather than a
    # rebuild.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Maestro CLI
        run: |
          # Install Maestro with verbose output
          # Pinned. Why, and the caveat that this does NOT by itself make a
          # local run predict CI (nothing pins your machine): see "How Maestro
          # validates this suite", point 4, in .maestro/README.md.
          export MAESTRO_VERSION=2.4.0
          curl -fsSL https://get.maestro.mobile.dev | bash

          # Verify installation directory exists
          if [ ! -d "$HOME/.maestro/bin" ]; then
            echo "Error: Maestro installation directory not found"
            exit 1
          fi

          # Verify maestro binary exists
          if [ ! -f "$HOME/.maestro/bin/maestro" ]; then
            echo "Error: Maestro binary not found"
            ls -la "$HOME/.maestro/bin" || true
            exit 1
          fi

          # Make sure it's executable
          chmod +x "$HOME/.maestro/bin/maestro"

          # Add to PATH for this step
          export PATH="$HOME/.maestro/bin:$PATH"

          # Add to PATH for future steps
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

          # Assert the pin actually took — the checks above prove only that
          # SOME maestro installed, not which version. Full argument at the
          # canonical copy of this step in .github/workflows/maestro-e2e.yml.
          ACTUAL_VERSION=$(maestro --version)
          if [ "$ACTUAL_VERSION" != "$MAESTRO_VERSION" ]; then
            echo "Error: installed Maestro is '$ACTUAL_VERSION', expected '$MAESTRO_VERSION'"
            exit 1
          fi
          echo "Maestro $ACTUAL_VERSION installed (pinned)"

      - name: Setup test environment
        run: |
          cp .env.example .env.test
          echo "EXPO_PUBLIC_USE_MOCK_SERVER=true" >> .env.test

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prebuild Expo app for Android
        run: npx expo prebuild --platform android --clean

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android app
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Setup Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Install app
            adb install android/app/build/outputs/apk/debug/app-debug.apk

            # Start mock server if needed
            if [ "$EXPO_PUBLIC_USE_MOCK_SERVER" = "true" ]; then
              npm run mock-server &
              sleep 5
            fi

            # Run Maestro tests. Every flow hardcodes the iOS bundle ID
            # (org.verily.FSbeerselector) — see the note on this job above.
            # This will fail at launchApp against the Android build
            # (org.verily.FSBeerselector, per app.json) every time; that is
            # the known, accepted state, not a bug in this step.
            maestro test .maestro/ \
              --format junit \
              --output maestro-results-android.xml

            # Stop mock server
            pkill -f mock-server || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results-android
          path: |
            maestro-results-android.xml
            ~/.maestro/tests/

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-android
          path: ~/.maestro/

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maestro E2E Tests (Android)
          path: maestro-results-android.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [maestro-ios, maestro-ios-parallel, maestro-android]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Generate test summary
        env:
          # `needs.<job>.result` is GitHub's own tracked outcome for each job
          # — "success", "failure", "cancelled", or "skipped" — not a proxy
          # for it. The directory-existence checks this replaced
          # (`[ -d test-results/maestro-test-results-ios ]`) were never a
          # reliable proxy either: every upload step in every Maestro job
          # runs with `if: always()`, specifically so a failed run still
          # leaves screenshots and logs behind for debugging. That means the
          # directory this used to check for was present whether the tests
          # passed OR failed — it could report PASSED, but had no way to ever
          # report FAILED, which is the one outcome a test summary exists to
          # catch.
          IOS_RESULT: ${{ needs.maestro-ios.result }}
          IOS_PARALLEL_RESULT: ${{ needs.maestro-ios-parallel.result }}
        run: |
          echo "## 🧪 Maestro E2E Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** $(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          overall_fail=0

          # $1 = human label, $2 = needs.<job>.result value.
          report_platform() {
            case "$2" in
              success)
                echo "### ✅ $1 - PASSED" >> "$GITHUB_STEP_SUMMARY"
                echo "All $1 tests completed successfully." >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped)
                echo "### ⏭️ $1 - SKIPPED" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "### ❌ $1 - FAILED" >> "$GITHUB_STEP_SUMMARY"
                echo "$1 tests encountered failures (job result: $2). Check artifacts for details." >> "$GITHUB_STEP_SUMMARY"
                overall_fail=1
                ;;
            esac
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }

          report_platform "iOS Tests (Sequential)" "$IOS_RESULT"

          # iOS parallel results (if PR). $IOS_PARALLEL_RESULT is ONE
          # aggregated result for the whole matrix — GitHub reports "failure"
          # here if any single test group failed — so it is what decides
          # PASSED/FAILED. The per-group breakdown below is presentation
          # only: it inspects each group's actual JUnit XML for a `<failure`
          # element, which is real signal (unlike the artifact directory,
          # which is uploaded via `if: always()` regardless of outcome), but
          # is not itself what this step fails on.
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            report_platform "iOS Tests (Parallel)" "$IOS_PARALLEL_RESULT"

            echo "**Test Group Detail:**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for group in login-flows settings beer-features offline-network error-handling; do
              dir="test-results/maestro-parallel-results-$group"
              # `<error` as well as `<failure`, and "XML present" before either:
              # see the Android block below for why both arms matter.
              if [ ! -d "$dir" ]; then
                echo "- ❔ **$group**: no results uploaded" >> "$GITHUB_STEP_SUMMARY"
              elif ! find "$dir" -name '*.xml' -type f 2>/dev/null | grep -q .; then
                echo "- ❔ **$group**: INCONCLUSIVE (artifact uploaded, no JUnit XML)" >> "$GITHUB_STEP_SUMMARY"
              elif grep -rlq '<failure\|<error' "$dir" 2>/dev/null; then
                echo "- ❌ **$group**: FAILED" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- ✅ **$group**: PASSED" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Android is known-red and non-blocking (`continue-on-error: true`
          # on the `maestro-android` job — see the comment there and in
          # .maestro/config.yaml). That setting makes
          # `needs.maestro-android.result` UNRELIABLE for reporting here:
          # GitHub Actions reports "success" in the `needs` context for a
          # continue-on-error job even when its steps genuinely failed, which
          # would make this section claim PASSED unconditionally — the exact
          # "green that means nothing" this whole job exists to stop
          # printing. Inspecting the uploaded JUnit XML directly (same
          # technique as the parallel per-group detail above) reports what
          # actually happened instead. Deliberately not fed into
          # `overall_fail`: Android isn't a supported target right now, so
          # gating the PR check on it would be a failure nobody can act on.
          android_dir="test-results/maestro-test-results-android"
          #
          # Matches `<error` as well as `<failure`. A launch failure — which is
          # what this job produces every run, because the flows carry the iOS
          # bundle ID — is reported by JUnit as `<error>`, so grepping only for
          # `<failure` printed "✅ PASSED" three lines under prose calling the
          # job known-red. An artifact holding `~/.maestro/tests/` logs but no
          # XML (maestro died before writing one) also fell through to PASSED,
          # and `if: always()` guarantees the directory exists either way.
          # Both cases reproduced against constructed artifact directories.
          # `<error` cannot false-match `errors="0"`: the `<` must be adjacent.
          if [ ! -d "$android_dir" ]; then
            echo "### ❔ Android Tests - NO RESULTS" >> "$GITHUB_STEP_SUMMARY"
            echo "Known-red, non-blocking — Android is not a supported target right now (see .maestro/config.yaml). No results were uploaded." >> "$GITHUB_STEP_SUMMARY"
          elif ! find "$android_dir" -name '*.xml' -type f 2>/dev/null | grep -q .; then
            echo "### ❔ Android Tests - INCONCLUSIVE" >> "$GITHUB_STEP_SUMMARY"
            echo "An artifact was uploaded but contains no JUnit XML, so nothing can be concluded from it. Known-red, non-blocking (see .maestro/config.yaml)." >> "$GITHUB_STEP_SUMMARY"
          elif grep -rlq '<failure\|<error' "$android_dir" 2>/dev/null; then
            echo "### ❌ Android Tests - FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "Known-red, non-blocking — Android is not a supported target right now (see .maestro/config.yaml)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Android Tests - PASSED" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Test artifacts
          echo "### 📦 Test Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test results: JUnit XML format" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screenshots: Available for failed tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test recordings: Available in Maestro logs" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "- Parallel test results: Grouped by test category" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Execution mode info
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "### ⚡ Parallel Execution Mode" >> "$GITHUB_STEP_SUMMARY"
            echo "This PR used parallel test execution for faster feedback (~15min vs 45min sequential)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Next steps
          echo "### 📋 Next Steps" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Review test results in the artifacts section" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Check screenshots for visual issues" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Review Maestro logs for detailed error messages" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Fix any failing tests before merging" >> "$GITHUB_STEP_SUMMARY"

          # The point of this whole job: previously nothing here ever ran
          # `exit 1`, so "Test Summary" showed green on every PR regardless
          # of what the markdown above said — including when every upstream
          # Maestro job failed outright. `overall_fail` is set above from the
          # same `needs.*.result` values the summary reports; failing on it
          # is what makes this job's own status (and therefore the PR check)
          # agree with what a human reading the summary would conclude.
          if [ "$overall_fail" -ne 0 ]; then
            echo "One or more Maestro test jobs did not succeed — see the summary above." >&2
            exit 1
          fi
