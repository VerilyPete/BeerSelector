# Maestro Configuration for BeerSelector
# This file defines environment variables and settings for Maestro tests

env:
  # App ID for iOS and Android
  APP_ID_IOS: "org.verily.FSbeerselector"
  # Third place the scaffold placeholder survived, after the Android CI job
  # and 16-offline-mode.yaml. The real package capitalises the B.
  APP_ID_ANDROID: "org.verily.FSBeerselector"

  # Default to iOS for local testing
  APP_ID: ${APP_ID_IOS}

# Test suite configuration
flows:
  - 01-beer-list-rendering.yaml
  - 02-search-and-filter.yaml
  - 03-beer-item-expansion.yaml
  - 04-empty-states.yaml
  - 05-navigation-and-tabs.yaml
  - 06-login-flow-member.yaml
  - 07-login-flow-visitor.yaml
  - 08-auto-login.yaml
  - 09-refresh-functionality.yaml
  - 10-settings-configuration.yaml
  - 11-settings-first-launch.yaml
  - 12-offline-scenarios.yaml
  - 13-network-timeout-recovery.yaml
  - 14-api-error-handling.yaml
  # Adopted: these two existed on disk but were never registered here, so they
  # had never run. Unregistered flows are invisible — add new ones to this list.
  - 15-config-validation.yaml
  - 16-offline-mode.yaml
  # Schema migrations must release the master lock; a leak hangs at splash.
  - 19-migration-lock.yaml
  # Live Activity tests (require physical iOS device - iOS 16.1+)
  # These tests will fail on simulators - run only on physical devices
  - live-activity-restart.yaml
  - live-activity-empty-queue.yaml
  - live-activity-logout.yaml
  # Deep-link cold launch (runs on simulator too — uses openLink, not a real Live Activity)
  - live-activity-deep-link-cold-launch.yaml

# Performance thresholds
performance:
  # Target FPS for smooth scrolling
  minFPS: 55

  # Maximum acceptable frame time (in ms)
  maxFrameTime: 18

  # Maximum acceptable interaction delay (in ms)
  maxInteractionDelay: 300
