# .maestro/31-loading-all-tabs.yaml
# Test 12: All Tabs - Consistent Loading Behavior
#
# Split out of beer-list-loading.yaml (Wave 7.1). That file concatenated
# these 12 flows as 12 YAML documents, and Maestro only ever read the
# first — the other 11 had never run. See "How Maestro validates this
# suite", point 3, in README.md.
#
# STATUS: RED here, cause only PARTLY established. Not registered in
# config.yaml. See Wave 7.1 in plans/review-remediation-round-8.md.
#
# Ran against Maestro 2.4.0 on a simulator: fails in 19s at the first `tapOn`
# with "Element not found". Two separate things are true, and conflating them
# would repeat the mistake this round exists to correct:
#
#   1. ESTABLISHED, machine-independent: this flow does
#      `launchApp: clearState: true`, and 11-settings-first-launch.yaml asserts
#      that after a state wipe the app redirects to Settings and refuses to
#      navigate away until API URLs are configured. There is no tab to tap at
#      that point. This is a real precondition gap in the test.
#
#   2. NOT ESTABLISHED: the local run cannot demonstrate it, because the app
#      installed on this simulator is itself unconfigured and sits on Settings
#      even with clearState: false. So the observed failure does not prove
#      point 1 caused it — point 1 is proven by 11-*, not by this run. Whether
#      the flow passes once the app is configured is UNKNOWN and untested.
#
# A dead selector was also fixed on the way: this flow tapped "All Beers Tab" /
# "Beerfinder Tab" / "Tasted Brews Tab", none of which exist. The replacements
# are "All Beer" / "Beerfinder" / "Tasted Brews".
#
# CORRECTION: the justification first written here cited
# app/(tabs)/_layout.tsx's `Tabs.Screen options={{title:...}}` values. That
# citation was WRONG. The custom TerminalTabBar renders TAB_CONFIGS labels —
# "HOME"/"BEERS"/"FINDER"/"TASTED" — and never reads options.title. The
# replacements are still right, but for a different reason: they match the Home
# tab's NavigationCards and the per-screen ScanlineTitle headers. Point 5 in
# README.md has the real mapping and what remains unverified.
#
# THIS FLOW IS MULTI-HOP, which is the unverified case. It taps a tab, leaves
# Home, and taps another. React Navigation detaches inactive screens by
# default, so Home's NavigationCards — the elements those strings match — may
# no longer be in the hierarchy for the second and third taps. Nobody has run
# this against a configured simulator. If it fails there, the fix is to route
# via Home between hops or match testID="nav-*", not to change the string.
#
# Fixing the precondition: configure the app first, keeping clearState: true.
# Do NOT just flip to clearState: false — the skeleton these flows assert on is
# what shows before cached data arrives, so warm state may leave nothing to
# catch and the test VACUOUS. That is a green tick bought by deleting the test.

appId: org.verily.FSbeerselector
---
- launchApp:
    clearState: true

# Dismiss Expo dev menu if present
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: Escape
      - waitForAnimationToEnd

# Test each tab has consistent loading UX
- tapOn: "All Beers"
- assertVisible:
    id: "skeleton-loader"
- waitForAnimationToEnd
- assertNotVisible: "skeleton-loader"

- tapOn: "Beerfinder"
- assertVisible:
    id: "skeleton-loader"
- waitForAnimationToEnd
- assertNotVisible: "skeleton-loader"

- tapOn: "Tasted Brews"
- assertVisible:
    id: "skeleton-loader"
- waitForAnimationToEnd
- assertNotVisible: "skeleton-loader"

# All tabs should behave consistently
