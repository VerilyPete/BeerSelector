name: BeerSelectorNative
options:
  deploymentTarget:
    iOS: '17.6'
configs:
  Debug: debug
  Release: release
  Performance: release
settings:
  configs:
    Performance:
      ENABLE_TESTABILITY: YES
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: N9F7839KSX
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '37'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BeerSelectorNative:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - UI
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.verily.FSbeerselector
        CODE_SIGN_ENTITLEMENTS: App/BeerSelector.entitlements
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BeerQueueWidget
        embed: true
      - sdk: libsqlite3.tbd
  BeerQueueWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.verily.FSbeerselector.BeerQueueWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/BeerQueueWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BeerSelectorNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BeerSelectorNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.verily.FSbeerselector.native-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BeerSelectorNative:
    build:
      targets:
        BeerSelectorNative: all
    test:
      gatherCoverageData: true
      testPlans:
        - path: TestPlans/All.xctestplan
          defaultPlan: true
        - path: TestPlans/Unit.xctestplan
        - path: TestPlans/Integration.xctestplan
      targets:
        - name: BeerSelectorNativeTests
          parallelizable: true
          randomExecutionOrder: true

  BeerSelectorProfile:
    build:
      targets:
        BeerSelectorNative: all
    run:
      config: Release
    profile:
      config: Release
    test:
      config: Performance
      gatherCoverageData: false
      testPlans:
        - path: TestPlans/Performance.xctestplan
          defaultPlan: true
