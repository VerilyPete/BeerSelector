- scrollUntilVisible:
    element:
      text: Performance Diagnostics
    direction: DOWN
- tapOn: Performance Diagnostics
- scrollUntilVisible:
    element:
      text: Share Diagnostics
    direction: DOWN
- assertVisible: Share Diagnostics
- scrollUntilVisible:
    element:
      id: reset-first-run-button
    direction: DOWN
- assertVisible:
    id: reset-first-run-button
