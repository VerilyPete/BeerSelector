# Launch on an isolated simulator with --preview-fixtures --preview-screen finder.
# These fixtures never read personal data or make refresh network requests.
appId: org.verily.FSbeerselector
---
- assertVisible: "6 to discover"
- tapOn:
    id: container-filter-draft
- tapOn:
    id: search-input
- inputText: no-such-beer
- pressKey: Enter
- assertVisible: "No beers match your filters"
- assertVisible:
    id: retry-beer-refresh
- tapOn:
    id: clear-beer-filters
- assertVisible: "6 to discover"
- assertVisible:
    id: container-filter-all
    selected: true
- assertNotVisible: "No beers match your filters"
