# Isolated Debug fixture only; no model, network or queue writes. Launch with:
# xcrun simctl launch <simulator-id> org.verily.FSbeerselector --preview-fixtures --preview-suggestions on --preview-suggestion-mode local-matching
appId: org.verily.FSbeerselector
---
- extendedWaitUntil:
    visible:
      id: home-recommendations
    timeout: 15000
- assertVisible: "Local matching"
- assertVisible: "Picks from your tasting history and the styles you choose."
- assertNotVisible: "Ask Apple Intelligence"
- tapOn:
    id: home-recommendations
- assertVisible:
    id: suggestion-mode-plate
    text: "LOCAL MATCHING"
- scrollUntilVisible:
    element:
      id: recommendation-generate
    direction: DOWN
- tapOn:
    id: recommendation-generate
- scrollUntilVisible:
    element:
      id: recommendation-source
    direction: DOWN
- assertVisible:
    id: recommendation-source
    text: "Local matching\\. Picks from.*"
- tapOn: Done
- tapOn:
    id: settings-nav-button
- scrollUntilVisible:
    element:
      id: suggestion-compatibility
    direction: DOWN
- assertVisible:
    id: suggestion-compatibility
    text: "Local matching.*"
