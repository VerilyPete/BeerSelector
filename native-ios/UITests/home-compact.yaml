# Launch on an isolated simulator with --preview-fixtures --preview-suggestions off
# (iPhone, or an iPad window narrower than 768pt). Suggestions are pinned off because
# earlier flows leave them on, and with the suggestion card most iPhones fit one row.
# The compact Home has no nav cards: New on Tap shows the two newest beers, and
# the Rewards card opens Rewards.
appId: org.verily.FSbeerselector
---
- assertNotVisible:
    id: nav-all-beers
- assertNotVisible:
    id: nav-beerfinder
- scrollUntilVisible:
    element:
      id: beer-item-2
    centerElement: true
- assertVisible:
    id: beer-item-1
- assertNotVisible:
    id: beer-item-7
- tapOn:
    id: beer-item-1
- assertVisible:
    id: beer-description-1
- assertNotVisible:
    id: check-in-1
- tapOn:
    id: beer-item-1
- assertNotVisible:
    id: beer-description-1
- scrollUntilVisible:
    element:
      id: home-rewards-card
    centerElement: true
- assertVisible:
    id: home-rewards-card
    text: ".*2 rewards ready.*"
- tapOn:
    id: home-rewards-card
- assertVisible: "Close Rewards"
- tapOn: "Close Rewards"
- scrollUntilVisible:
    element:
      id: home-new-on-tap-view-all
    centerElement: true
- tapOn:
    id: home-new-on-tap-view-all
- assertVisible: "7 beers on tap"
