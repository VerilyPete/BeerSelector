# Every fallback from Apple Intelligence shows a prominent notice above the
# results. Isolated Debug fixture with an offline provider; no model, network or
# queue writes. Launch with any failure outcome, for example:
# xcrun simctl launch <simulator-id> org.verily.FSbeerselector --preview-fixtures --preview-recommendations --preview-suggestion-mode apple-intelligence --preview-ai-outcome provider-failure
# (also invalid-output, deadline, context-budget)
appId: org.verily.FSbeerselector
---
- extendedWaitUntil:
    visible:
      id: suggestion-mode-plate
    timeout: 15000
- assertNotVisible:
    id: recommendation-fallback-notice
- scrollUntilVisible:
    element:
      id: recommendation-generate
    direction: DOWN
- tapOn:
    id: recommendation-generate
- extendedWaitUntil:
    visible:
      id: recommendation-fallback-notice
    timeout: 10000
- assertVisible: "Apple Intelligence couldn’t answer this time. These are local matches from your tasting history."
- assertVisible:
    id: recommendation-fallback-retry
- tapOn:
    id: recommendation-fallback-retry
- extendedWaitUntil:
    visible:
      id: recommendation-fallback-notice
    timeout: 10000
- scrollUntilVisible:
    element:
      id: recommendation-source
    direction: DOWN
- assertVisible:
    id: recommendation-source
    text: "Local matches, not Apple Intelligence.*"
